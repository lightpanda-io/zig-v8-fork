name: prebuild v8

on:
  workflow_call:
    inputs:
      runner:
        type: string
      target:
        type: string
      build_type:
        type: string
      lp_cache:
        type: string
        default: '.lp-cache'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Parse target
        shell: bash
        run: |
          echo "OS=$(echo "${{ inputs.target }}" | cut -d- -f2)" >> "$GITHUB_ENV"
          echo "ARCH=$(echo "${{ inputs.target }}" | cut -d- -f1)" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      # Zig 0.16 writes fetched .zip archives to <global cache>/tmp but no longer
      # creates that directory, so zip dependencies (sqlite amalgamation) fail
      # with "failed to create temporary zip file: FileNotFound" on the fresh
      # cache dir setup-zig points ZIG_GLOBAL_CACHE_DIR at.
      - name: Zig 0.16 zip-fetch workaround
        shell: bash
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Read V8 version from build.zig
        shell: bash
        run: echo "V8_REVISION=$(sed -n 's/^const V8_VERSION.*"\(.*\)".*/\1/p' build.zig)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6.2.0
        if: contains(inputs.target, 'macos') || contains(inputs.target, 'ios')
        with:
          python-version: '3.13'

      - name: Install dependencies (Linux x86_64)
        if: contains(inputs.target, 'linux')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -yq libglib2.0-dev lld

      - name: Install dependencies (Linux aarch64)
        if: contains(inputs.target, 'aarch64-linux')
        shell: bash
        run: |
            wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh
            sudo ./llvm.sh 23
            CLANG_DIR=/usr/lib/llvm-23/lib/clang/23
            sudo ln -nsf "$CLANG_DIR/lib/linux/libclang_rt.builtins-aarch64.a" "$CLANG_DIR/lib/linux/libclang_rt.builtins.a"
            sudo ln -nsf "$CLANG_DIR/lib/linux" "$CLANG_DIR/lib/aarch64-unknown-linux-gnu"

      - shell: bash
        run: zig env

      - name: Build V8
        shell: bash
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            zig build -Dtarget="${{ inputs.target }}" -Doptimize=debug -Dis_tsan=true -Dv8_enable_sandbox=true build-v8
          else
            zig build -Dtarget="${{ inputs.target }}" -Doptimize=safe build-v8
          fi

      # zig's self-hosted linker doesn't work when we statically link V8. I'm
      # not sure what the issue is (I believe there are multiple issues). But
      # It does work if we dynamically link it. Claude says it has something
      # to do with CREL relocations which Zig can't do but the bundled lld here
      # handles fine. Maybe as a separate issue (or maybe it's the same) there's
      # also problems caused by the allocator shim. Whatever the case, this step
      # exists to create a dynamic library that can be used with browser's
      # -Ddev_fast builds.
      - name: Link shared v8 library
        if: inputs.target == 'x86_64-linux' && inputs.build_type == 'release'
        shell: bash
        run: |
          V8_DIR=${{ inputs.lp_cache }}/v8-${{ env.V8_REVISION }}
          V8_LIB_PATH=($V8_DIR/out/${{ env.OS }}/${{ inputs.build_type }}_*/obj/zig/libc_v8.a)
          "$V8_DIR/third_party/llvm-build/Release+Asserts/bin/clang++" \
            -shared -fuse-ld=lld -nostdlib++ \
            -o "libc_v8_${{ env.V8_REVISION }}_${{ env.OS }}_${{ env.ARCH }}.so" \
            -Wl,-soname,libc_v8.so \
            -Wl,--version-script=build-tools/v8_exports.map \
            -Wl,--whole-archive "${V8_LIB_PATH[0]}" -Wl,--no-whole-archive \
            -lpthread -ldl -lm

      - name: Find v8 library
        shell: bash
        run: |
          DST="${{ env.ARCH }}"
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            DST="${DST}_debug"
          fi
          if [ "${{ env.OS }}" = "ios" ]; then
            DST="simulator_${DST}"
          fi
          V8_LIB_PATH=(${{ inputs.lp_cache }}/v8-${{ env.V8_REVISION }}/out/${{ env.OS }}/${{ inputs.build_type }}_*/obj/zig/libc_v8.a)
          mv "${V8_LIB_PATH[0]}" "libc_v8_${{ env.V8_REVISION }}_${{ env.OS }}_$DST.a"

      - name: Upload the build
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: libc_v8_*.a,libc_v8_*.so
          # Semver convention: hyphenated tags (v0.4.8-slim.0) are prereleases,
          # so experimental builds never become the "latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
